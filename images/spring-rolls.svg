<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bg-sr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1d12"/>
      <stop offset="1" stop-color="#0f0806"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dba6"/>
      <stop offset=".5" stop-color="#d9a85a"/>
      <stop offset="1" stop-color="#8a4a1a"/>
    </linearGradient>
    <linearGradient id="rollHL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde8a6" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fde8a6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="plateS" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#f6f1e7"/>
      <stop offset="100%" stop-color="#6e5a3a"/>
    </radialGradient>
    <radialGradient id="sauce" cx="40%" cy="40%" r="60%">
      <stop offset="0" stop-color="#d4593a"/>
      <stop offset=".6" stop-color="#8a2e1a"/>
      <stop offset="1" stop-color="#3a0f08"/>
    </radialGradient>
    <filter id="sr-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg-sr)"/>

  <!-- plate shadow -->
  <ellipse cx="500" cy="820" rx="400" ry="30" fill="#000" opacity=".65" filter="url(#sr-blur)"/>

  <!-- plate -->
  <ellipse cx="500" cy="760" rx="400" ry="90" fill="#1a0f06"/>
  <ellipse cx="500" cy="740" rx="400" ry="80" fill="url(#plateS)"/>
  <ellipse cx="500" cy="740" rx="350" ry="65" fill="#ebe2d1"/>

  <!-- sauce ramekin -->
  <ellipse cx="500" cy="690" rx="70" ry="18" fill="#1a0f06"/>
  <ellipse cx="500" cy="685" rx="68" ry="16" fill="#f6f1e7"/>
  <ellipse cx="500" cy="685" rx="60" ry="14" fill="url(#sauce)"/>
  <circle cx="492" cy="680" r="4" fill="#f6b35a" opacity=".9"/>
  <circle cx="508" cy="686" r="2.5" fill="#f6b35a" opacity=".7"/>

  <!-- spring rolls (three, isometric) -->
  <g>
    <!-- roll 1 -->
    <g transform="translate(290 680) rotate(-20)">
      <ellipse cx="0" cy="0" rx="140" ry="38" fill="#5a2a0e" opacity=".8" filter="url(#sr-blur)"/>
      <rect x="-130" y="-32" width="260" height="60" rx="30" fill="url(#roll)"/>
      <rect x="-130" y="-32" width="260" height="25" rx="12" fill="url(#rollHL)"/>
      <!-- wrapper lines -->
      <path d="M-100 -20 Q -70 20 -40 -15" stroke="#a65a2a" stroke-width="1" fill="none" opacity=".6"/>
      <path d="M20 -22 Q 50 20 90 -15" stroke="#a65a2a" stroke-width="1" fill="none" opacity=".6"/>
      <!-- caps (shrimp pink) -->
      <ellipse cx="-130" cy="-2" rx="12" ry="25" fill="#ec8060"/>
      <ellipse cx="130" cy="-2" rx="12" ry="25" fill="#ec8060"/>
    </g>

    <!-- roll 2 -->
    <g transform="translate(500 650) rotate(0)">
      <ellipse cx="0" cy="0" rx="150" ry="40" fill="#5a2a0e" opacity=".8" filter="url(#sr-blur)"/>
      <rect x="-140" y="-34" width="280" height="64" rx="32" fill="url(#roll)"/>
      <rect x="-140" y="-34" width="280" height="26" rx="12" fill="url(#rollHL)"/>
      <path d="M-110 -20 Q -70 25 -40 -16" stroke="#a65a2a" stroke-width="1" fill="none" opacity=".6"/>
      <path d="M20 -22 Q 60 25 100 -16" stroke="#a65a2a" stroke-width="1" fill="none" opacity=".6"/>
      <ellipse cx="-140" cy="-2" rx="13" ry="27" fill="#ec8060"/>
      <ellipse cx="140" cy="-2" rx="13" ry="27" fill="#ec8060"/>
    </g>

    <!-- roll 3 -->
    <g transform="translate(710 680) rotate(20)">
      <ellipse cx="0" cy="0" rx="140" ry="38" fill="#5a2a0e" opacity=".8" filter="url(#sr-blur)"/>
      <rect x="-130" y="-32" width="260" height="60" rx="30" fill="url(#roll)"/>
      <rect x="-130" y="-32" width="260" height="25" rx="12" fill="url(#rollHL)"/>
      <path d="M-100 -20 Q -70 20 -40 -15" stroke="#a65a2a" stroke-width="1" fill="none" opacity=".6"/>
      <path d="M20 -22 Q 50 20 90 -15" stroke="#a65a2a" stroke-width="1" fill="none" opacity=".6"/>
      <ellipse cx="-130" cy="-2" rx="12" ry="25" fill="#ec8060"/>
      <ellipse cx="130" cy="-2" rx="12" ry="25" fill="#ec8060"/>
    </g>
  </g>

  <!-- herb garnish -->
  <g fill="#4a8a3a">
    <ellipse cx="220" cy="730" rx="22" ry="10" transform="rotate(-30 220 730)"/>
    <ellipse cx="780" cy="730" rx="22" ry="10" transform="rotate(30 780 730)"/>
    <circle cx="200" cy="740" r="5"/>
    <circle cx="800" cy="740" r="5"/>
  </g>

  <!-- top warm glow -->
  <ellipse cx="500" cy="300" rx="500" ry="200" fill="#b8864a" opacity=".12"/>
</svg>
