<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sv-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2820"/>
      <stop offset="1" stop-color="#140e0a"/>
    </linearGradient>
    <radialGradient id="sv-light" cx="50%" cy="20%" r="40%">
      <stop offset="0" stop-color="#f3d58a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#b8864a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sv-sign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e2e2e"/>
      <stop offset="1" stop-color="#4a1414"/>
    </linearGradient>
    <linearGradient id="sv-brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a2a"/>
      <stop offset="1" stop-color="#2a1d14"/>
    </linearGradient>
    <filter id="sv-blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#sv-bg)"/>
  <rect width="800" height="500" fill="url(#sv-light)"/>

  <!-- brick wall facade -->
  <rect y="200" width="800" height="800" fill="url(#sv-brick)"/>
  <g opacity=".3" stroke="#1a0f06" stroke-width="1">
    <!-- brick rows -->
    <g>
      <line x1="0" y1="250" x2="800" y2="250"/>
      <line x1="0" y1="290" x2="800" y2="290"/>
      <line x1="0" y1="330" x2="800" y2="330"/>
      <line x1="0" y1="370" x2="800" y2="370"/>
      <line x1="0" y1="410" x2="800" y2="410"/>
      <line x1="0" y1="450" x2="800" y2="450"/>
      <line x1="0" y1="490" x2="800" y2="490"/>
      <line x1="0" y1="530" x2="800" y2="530"/>
      <line x1="0" y1="570" x2="800" y2="570"/>
      <line x1="0" y1="610" x2="800" y2="610"/>
      <line x1="0" y1="650" x2="800" y2="650"/>
      <line x1="0" y1="690" x2="800" y2="690"/>
      <line x1="0" y1="730" x2="800" y2="730"/>
      <line x1="0" y1="770" x2="800" y2="770"/>
      <line x1="0" y1="810" x2="800" y2="810"/>
    </g>
    <!-- brick verticals offset -->
    <g>
      <line x1="80" y1="250" x2="80" y2="290"/>
      <line x1="200" y1="250" x2="200" y2="290"/>
      <line x1="320" y1="250" x2="320" y2="290"/>
      <line x1="440" y1="250" x2="440" y2="290"/>
      <line x1="560" y1="250" x2="560" y2="290"/>
      <line x1="680" y1="250" x2="680" y2="290"/>

      <line x1="140" y1="290" x2="140" y2="330"/>
      <line x1="260" y1="290" x2="260" y2="330"/>
      <line x1="380" y1="290" x2="380" y2="330"/>
      <line x1="500" y1="290" x2="500" y2="330"/>
      <line x1="620" y1="290" x2="620" y2="330"/>
      <line x1="740" y1="290" x2="740" y2="330"/>

      <line x1="80" y1="330" x2="80" y2="370"/>
      <line x1="200" y1="330" x2="200" y2="370"/>
      <line x1="320" y1="330" x2="320" y2="370"/>
      <line x1="440" y1="330" x2="440" y2="370"/>
      <line x1="560" y1="330" x2="560" y2="370"/>
      <line x1="680" y1="330" x2="680" y2="370"/>
    </g>
  </g>

  <!-- storefront window -->
  <rect x="100" y="500" width="600" height="400" fill="#1a0f06"/>
  <rect x="110" y="510" width="580" height="380" fill="url(#sv-light)" opacity=".4"/>
  <rect x="110" y="510" width="580" height="380" fill="#2a1d12" opacity=".9"/>
  <!-- window inner light reflections -->
  <g opacity=".4">
    <circle cx="200" cy="620" r="30" fill="#f6b35a" filter="url(#sv-blur)"/>
    <circle cx="400" cy="660" r="40" fill="#f6b35a" filter="url(#sv-blur)"/>
    <circle cx="580" cy="620" r="30" fill="#f6b35a" filter="url(#sv-blur)"/>
    <!-- interior hints: table/chair silhouettes -->
    <rect x="200" y="760" width="120" height="80" fill="#4a3220" opacity=".7"/>
    <rect x="440" y="760" width="120" height="80" fill="#4a3220" opacity=".7"/>
  </g>
  <!-- window frame -->
  <rect x="100" y="500" width="600" height="400" fill="none" stroke="#1a0f06" stroke-width="4"/>
  <line x1="100" y1="700" x2="700" y2="700" stroke="#1a0f06" stroke-width="4"/>
  <line x1="400" y1="500" x2="400" y2="900" stroke="#1a0f06" stroke-width="4"/>

  <!-- Awning / signboard -->
  <g transform="translate(400 400)">
    <!-- shadow -->
    <ellipse cx="0" cy="60" rx="330" ry="10" fill="#000" opacity=".4" filter="url(#sv-blur)"/>
    <!-- sign backing -->
    <rect x="-320" y="-80" width="640" height="140" rx="4" fill="url(#sv-sign)"/>
    <rect x="-320" y="-80" width="640" height="20" fill="#a63535"/>
    <rect x="-320" y="40" width="640" height="20" fill="#4a1414"/>
    <!-- highlights -->
    <line x1="-320" y1="-75" x2="320" y2="-75" stroke="#d4593a" stroke-width="2" opacity=".5"/>

    <!-- text -->
    <text x="0" y="-10" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="56" fill="#f6f1e7" letter-spacing="4">Bodega</text>
    <text x="0" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" letter-spacing="8" fill="#f6c874">BISTRO · SAN FRANCISCO</text>
    <!-- small years -->
    <text x="-280" y="-50" font-family="Inter,sans-serif" font-size="9" letter-spacing="4" fill="#f6f1e7" opacity=".6">EST. 2003</text>
    <text x="280" y="-50" text-anchor="end" font-family="Inter,sans-serif" font-size="9" letter-spacing="4" fill="#f6f1e7" opacity=".6">— 2017</text>
  </g>

  <!-- street lamp glow -->
  <circle cx="80" cy="150" r="25" fill="#f6b35a" opacity=".7"/>
  <circle cx="80" cy="150" r="80" fill="#f6b35a" opacity=".25" filter="blur(16px)"/>
  <circle cx="720" cy="180" r="25" fill="#f6b35a" opacity=".7"/>
  <circle cx="720" cy="180" r="80" fill="#f6b35a" opacity=".25" filter="blur(16px)"/>

  <!-- rain / grain overlay -->
  <g opacity=".06" stroke="#f6f1e7">
    <line x1="100" y1="100" x2="105" y2="200" stroke-width=".5"/>
    <line x1="250" y1="150" x2="255" y2="250" stroke-width=".5"/>
    <line x1="400" y1="100" x2="405" y2="200" stroke-width=".5"/>
    <line x1="550" y1="150" x2="555" y2="250" stroke-width=".5"/>
    <line x1="700" y1="100" x2="705" y2="200" stroke-width=".5"/>
  </g>
</svg>
