<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bg-ct" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1e7"/>
      <stop offset="1" stop-color="#d7c9b0"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c874"/>
      <stop offset="1" stop-color="#8a5a2a"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde8a6"/>
      <stop offset="1" stop-color="#d49854"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a2a"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </linearGradient>
    <filter id="ct-blur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg-ct)"/>

  <!-- table surface -->
  <ellipse cx="500" cy="860" rx="800" ry="100" fill="#8a6a3a" opacity=".15"/>

  <!-- Large takeout box (back) -->
  <g transform="translate(500 530)">
    <!-- shadow -->
    <ellipse cx="0" cy="260" rx="300" ry="30" fill="#000" opacity=".3" filter="url(#ct-blur)"/>

    <!-- box side (front face) -->
    <polygon points="-240,-50 240,-50 220,250 -220,250" fill="url(#boxSide)"/>
    <!-- box side left (perspective) -->
    <polygon points="-240,-50 -280,-20 -280,230 -220,250" fill="#5a3a1a"/>
    <!-- box top -->
    <polygon points="-280,-20 -240,-50 240,-50 280,-20 240,10 -240,10" fill="url(#boxTop)"/>
    <!-- box face front highlight -->
    <polygon points="-240,-50 240,-50 220,-20 -220,-20" fill="#fde8a6" opacity=".3"/>

    <!-- Bodega stamp on front -->
    <g transform="translate(0 100)">
      <circle r="80" fill="none" stroke="#f6f1e7" stroke-width="2" opacity=".6"/>
      <text y="-8" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="36" fill="#f6f1e7">Bodega</text>
      <text y="18" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" letter-spacing="6" fill="#f6f1e7">SAN FRANCISCO</text>
      <text y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" letter-spacing="4" fill="#d7c9b0">CATERING · EST. 2022</text>
    </g>

    <!-- fold crease -->
    <line x1="-240" y1="-50" x2="-220" y2="250" stroke="#3a1a08" stroke-width="1.5" opacity=".4"/>
    <line x1="240" y1="-50" x2="220" y2="250" stroke="#3a1a08" stroke-width="1.5" opacity=".4"/>
  </g>

  <!-- Smaller takeout box (front-right, overlap) -->
  <g transform="translate(680 650) scale(.7)">
    <ellipse cx="0" cy="260" rx="260" ry="24" fill="#000" opacity=".25" filter="url(#ct-blur)"/>
    <polygon points="-200,-40 200,-40 180,220 -180,220" fill="url(#box)"/>
    <polygon points="-200,-40 -240,-15 -240,195 -180,220" fill="#8a5a2a"/>
    <polygon points="-240,-15 -200,-40 200,-40 240,-15 200,10 -200,10" fill="url(#boxTop)"/>
    <!-- label -->
    <rect x="-80" y="50" width="160" height="80" fill="#f6f1e7" opacity=".9"/>
    <text x="0" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#141210">Bodega</text>
    <text x="0" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" letter-spacing="4" fill="#8e2e2e">TO GO</text>
    <text x="0" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-size="6" letter-spacing="2" fill="#141210">SF · 138 MASON</text>
  </g>

  <!-- Chopsticks beside -->
  <g transform="translate(220 700) rotate(20)">
    <rect x="0" y="0" width="260" height="7" rx="2" fill="#3a2a1a"/>
    <rect x="0" y="0" width="260" height="2.5" fill="#5a4428"/>
    <rect x="0" y="14" width="260" height="7" rx="2" fill="#3a2a1a"/>
    <rect x="0" y="14" width="260" height="2.5" fill="#5a4428"/>
    <!-- paper wrapper -->
    <rect x="100" y="-5" width="60" height="30" fill="#f6f1e7"/>
    <rect x="100" y="-5" width="60" height="30" fill="none" stroke="#8e2e2e" stroke-width="1"/>
    <text x="130" y="14" text-anchor="middle" font-family="Georgia,serif" font-size="9" font-style="italic" fill="#8e2e2e">Bodega</text>
  </g>

  <!-- Receipt / tag -->
  <g transform="translate(170 500) rotate(-10)">
    <rect x="-60" y="-80" width="120" height="160" fill="#f6f1e7" filter="url(#ct-blur)" opacity=".4"/>
    <rect x="-60" y="-80" width="120" height="160" fill="#f6f1e7"/>
    <text x="0" y="-50" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-style="italic" fill="#141210">Bodega SF</text>
    <line x1="-50" y1="-35" x2="50" y2="-35" stroke="#141210" stroke-width=".5"/>
    <text x="-45" y="-15" font-family="Inter,sans-serif" font-size="7" fill="#141210">Pho Hanoi</text>
    <text x="45" y="-15" text-anchor="end" font-family="Inter,sans-serif" font-size="7" fill="#141210">$22</text>
    <text x="-45" y="0" font-family="Inter,sans-serif" font-size="7" fill="#141210">Banh Cuon</text>
    <text x="45" y="0" text-anchor="end" font-family="Inter,sans-serif" font-size="7" fill="#141210">$16</text>
    <text x="-45" y="15" font-family="Inter,sans-serif" font-size="7" fill="#141210">Shaking Beef</text>
    <text x="45" y="15" text-anchor="end" font-family="Inter,sans-serif" font-size="7" fill="#141210">$25</text>
    <line x1="-50" y1="25" x2="50" y2="25" stroke="#141210" stroke-width=".5"/>
    <text x="-45" y="42" font-family="Inter,sans-serif" font-size="8" font-weight="bold" fill="#141210">Total</text>
    <text x="45" y="42" text-anchor="end" font-family="Inter,sans-serif" font-size="8" font-weight="bold" fill="#8e2e2e">$63</text>
    <text x="0" y="65" text-anchor="middle" font-family="Inter,sans-serif" font-size="6" letter-spacing="2" fill="#8e2e2e">THANK YOU</text>
  </g>

  <!-- top warm glow -->
  <circle cx="200" cy="200" r="200" fill="#f6b35a" opacity=".15" filter="url(#ct-blur)"/>
  <circle cx="800" cy="150" r="150" fill="#f6b35a" opacity=".1" filter="url(#ct-blur)"/>
</svg>
