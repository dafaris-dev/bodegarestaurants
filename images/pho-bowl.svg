<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <radialGradient id="pB-rim" cx="50%" cy="40%" r="55%">
      <stop offset="70%" stop-color="#f6f1e7"/>
      <stop offset="88%" stop-color="#d7c9b0"/>
      <stop offset="100%" stop-color="#6e5a3a"/>
    </radialGradient>
    <linearGradient id="pB-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a8a6c"/>
      <stop offset=".5" stop-color="#6e5a3a"/>
      <stop offset="1" stop-color="#2a1d12"/>
    </linearGradient>
    <radialGradient id="pB-broth" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d58d4a"/>
      <stop offset=".4" stop-color="#a0582a"/>
      <stop offset=".8" stop-color="#6b3312"/>
      <stop offset="1" stop-color="#3a1a08"/>
    </radialGradient>
    <radialGradient id="pB-brothHL" cx="30%" cy="25%" r="25%">
      <stop offset="0" stop-color="#ffd58c" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffd58c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pB-noodle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d78a"/>
      <stop offset=".5" stop-color="#f3e3a8"/>
      <stop offset="1" stop-color="#c99a4a"/>
    </linearGradient>
    <radialGradient id="pB-meat" cx="40%" cy="30%" r="60%">
      <stop offset="0" stop-color="#b03a2a"/>
      <stop offset=".5" stop-color="#7a1f14"/>
      <stop offset="1" stop-color="#3a0f08"/>
    </radialGradient>
    <filter id="pB-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="pB-steam" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- cast shadow -->
  <ellipse cx="500" cy="820" rx="420" ry="42" fill="#000" opacity=".55" filter="url(#pB-blur)"/>

  <!-- bowl exterior (3D side) -->
  <ellipse cx="500" cy="580" rx="420" ry="140" fill="url(#pB-side)"/>
  <!-- rim top -->
  <ellipse cx="500" cy="500" rx="420" ry="110" fill="url(#pB-rim)"/>
  <!-- bowl inner shadow -->
  <ellipse cx="500" cy="505" rx="370" ry="90" fill="#1a0f06" opacity=".85"/>
  <!-- broth surface -->
  <ellipse cx="500" cy="495" rx="340" ry="78" fill="url(#pB-broth)"/>
  <ellipse cx="500" cy="495" rx="340" ry="78" fill="url(#pB-brothHL)"/>

  <!-- oil droplets on broth -->
  <g opacity=".7">
    <ellipse cx="380" cy="480" rx="18" ry="4" fill="#f6b35a"/>
    <ellipse cx="430" cy="500" rx="22" ry="5" fill="#f6b35a"/>
    <ellipse cx="560" cy="490" rx="16" ry="4" fill="#f6b35a"/>
    <ellipse cx="620" cy="505" rx="14" ry="3" fill="#f6b35a"/>
    <ellipse cx="480" cy="520" rx="20" ry="5" fill="#f6b35a"/>
  </g>

  <!-- noodles (long curved strands) -->
  <g stroke="url(#pB-noodle)" stroke-width="4" fill="none" stroke-linecap="round" opacity=".92">
    <path d="M280 480 C 340 440 420 510 500 470 S 660 510 720 470"/>
    <path d="M300 500 C 360 460 440 530 520 490 S 680 530 710 495"/>
    <path d="M290 470 C 380 450 440 500 500 480 S 650 490 705 455"/>
    <path d="M330 510 C 400 480 480 545 560 505 S 680 540 710 510"/>
    <path d="M310 525 C 400 500 490 555 580 520 S 680 550 700 530"/>
    <path d="M340 445 C 420 420 500 470 580 445 S 660 460 700 440"/>
  </g>

  <!-- beef slices (3D) -->
  <g>
    <!-- slice 1 -->
    <ellipse cx="400" cy="480" rx="58" ry="20" fill="#1a0f08"/>
    <ellipse cx="400" cy="475" rx="55" ry="18" fill="url(#pB-meat)"/>
    <ellipse cx="395" cy="470" rx="25" ry="7" fill="#d4593a" opacity=".7"/>
    <!-- slice 2 -->
    <ellipse cx="550" cy="490" rx="60" ry="20" fill="#1a0f08"/>
    <ellipse cx="550" cy="486" rx="57" ry="18" fill="url(#pB-meat)"/>
    <ellipse cx="546" cy="482" rx="28" ry="8" fill="#d4593a" opacity=".7"/>
    <!-- slice 3 -->
    <ellipse cx="470" cy="465" rx="48" ry="17" fill="#1a0f08"/>
    <ellipse cx="470" cy="462" rx="46" ry="15" fill="url(#pB-meat)"/>
    <ellipse cx="465" cy="458" rx="20" ry="6" fill="#d4593a" opacity=".7"/>
  </g>

  <!-- scallions (green rings) -->
  <g fill="#4a8a3a">
    <circle cx="360" cy="480" r="4"/><circle cx="360" cy="480" r="2" fill="#f6f1e7"/>
    <circle cx="420" cy="495" r="4"/><circle cx="420" cy="495" r="2" fill="#f6f1e7"/>
    <circle cx="500" cy="455" r="4"/><circle cx="500" cy="455" r="2" fill="#f6f1e7"/>
    <circle cx="580" cy="470" r="4"/><circle cx="580" cy="470" r="2" fill="#f6f1e7"/>
    <circle cx="620" cy="490" r="4"/><circle cx="620" cy="490" r="2" fill="#f6f1e7"/>
    <circle cx="440" cy="510" r="4"/><circle cx="440" cy="510" r="2" fill="#f6f1e7"/>
  </g>

  <!-- herb leaves -->
  <g fill="#2d5a3a">
    <ellipse cx="340" cy="465" rx="12" ry="6" transform="rotate(-20 340 465)"/>
    <ellipse cx="600" cy="455" rx="12" ry="6" transform="rotate(15 600 455)"/>
    <ellipse cx="520" cy="440" rx="10" ry="5" transform="rotate(-10 520 440)"/>
  </g>

  <!-- chili slices -->
  <g fill="#a63535">
    <ellipse cx="470" cy="495" rx="7" ry="2.5"/>
    <ellipse cx="540" cy="470" rx="8" ry="3"/>
    <ellipse cx="400" cy="505" rx="6" ry="2"/>
  </g>

  <!-- rim highlight -->
  <ellipse cx="380" cy="430" rx="200" ry="14" fill="#fff" opacity=".4"/>
  <ellipse cx="620" cy="430" rx="60" ry="6" fill="#fff" opacity=".3"/>

  <!-- bowl bottom highlight -->
  <path d="M90 540 Q 500 720 910 540" stroke="#f6f1e7" stroke-width="2" fill="none" opacity=".25"/>

  <!-- steam -->
  <g stroke="#f6f1e7" fill="none" stroke-width="6" stroke-linecap="round" filter="url(#pB-steam)" opacity=".4">
    <path d="M400 420 Q 380 340 410 260 T 395 120">
      <animate attributeName="opacity" values=".4;.1;.4" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M500 410 Q 490 320 510 230 T 500 80">
      <animate attributeName="opacity" values=".35;.08;.35" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M600 420 Q 580 340 610 250 T 595 110">
      <animate attributeName="opacity" values=".4;.1;.4" dur="4.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- chopsticks (resting on bowl) -->
  <g transform="translate(720 420) rotate(-15)">
    <rect x="-8" y="0" width="220" height="7" rx="2" fill="#3a2a1a"/>
    <rect x="-8" y="0" width="220" height="2.5" fill="#5a4428"/>
    <rect x="-8" y="12" width="220" height="7" rx="2" fill="#3a2a1a"/>
    <rect x="-8" y="12" width="220" height="2.5" fill="#5a4428"/>
  </g>
</svg>
