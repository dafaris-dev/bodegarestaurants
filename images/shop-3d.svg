<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bg-sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1e7"/>
      <stop offset="1" stop-color="#d7c9b0"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d12"/>
      <stop offset="1" stop-color="#0f0806"/>
    </linearGradient>
    <linearGradient id="shirtFold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0f06"/>
      <stop offset=".5" stop-color="#2a1d12"/>
      <stop offset="1" stop-color="#140e0a"/>
    </linearGradient>
    <filter id="sh-blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg-sh)"/>

  <!-- table shadow -->
  <ellipse cx="500" cy="820" rx="400" ry="25" fill="#000" opacity=".2" filter="url(#sh-blur)"/>

  <!-- Folded T-shirt isometric -->
  <g transform="translate(500 500)">
    <!-- Stack shadow (deeper) -->
    <rect x="-240" y="200" width="480" height="40" rx="4" fill="#000" opacity=".15" filter="url(#sh-blur)"/>

    <!-- Bottom folded shirt (back) -->
    <g transform="translate(0 100)">
      <rect x="-220" y="-30" width="440" height="50" rx="6" fill="#8e2e2e"/>
      <rect x="-220" y="-30" width="440" height="14" rx="4" fill="#a63535"/>
    </g>

    <!-- Middle shirt -->
    <g transform="translate(0 60)">
      <rect x="-225" y="-35" width="450" height="55" rx="6" fill="#6e5a3a"/>
      <rect x="-225" y="-35" width="450" height="14" rx="4" fill="#8a6e4a"/>
    </g>

    <!-- Top shirt — the showcased merch -->
    <g>
      <!-- base folded block -->
      <rect x="-230" y="-180" width="460" height="200" rx="8" fill="url(#shirt)"/>
      <!-- top horizontal fold shadow -->
      <rect x="-230" y="-180" width="460" height="30" rx="8" fill="url(#shirtFold)"/>
      <!-- vertical fold lines -->
      <line x1="-80" y1="-180" x2="-80" y2="20" stroke="#0f0806" stroke-width="2" opacity=".7"/>
      <line x1="80" y1="-180" x2="80" y2="20" stroke="#0f0806" stroke-width="2" opacity=".7"/>
      <!-- highlight -->
      <rect x="-220" y="-175" width="440" height="4" fill="#4a3826" opacity=".3"/>

      <!-- Bodega logo on center -->
      <g transform="translate(0 -90)">
        <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#f6f1e7" letter-spacing="2">Bodega</text>
        <text x="0" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#d7c9b0" letter-spacing="6">SF · TOUR 2024</text>
        <line x1="-60" y1="40" x2="60" y2="40" stroke="#8e2e2e" stroke-width="1.5"/>
      </g>
    </g>

    <!-- gentle front-edge highlight -->
    <rect x="-230" y="20" width="460" height="5" fill="#f6f1e7" opacity=".15"/>
  </g>

  <!-- top left spotlight -->
  <circle cx="200" cy="200" r="200" fill="#f6b35a" opacity=".15" filter="url(#sh-blur)"/>

  <!-- small accessories (tag) -->
  <g transform="translate(730 650) rotate(15)">
    <rect x="-50" y="-30" width="100" height="60" rx="4" fill="#f6f1e7"/>
    <circle cx="-30" cy="-15" r="4" fill="#8e2e2e"/>
    <text x="10" y="-10" font-family="Georgia, serif" font-size="12" fill="#141210">Bodega</text>
    <text x="10" y="5" font-family="Inter, sans-serif" font-size="8" fill="#8e2e2e" letter-spacing="2">TOUR</text>
    <text x="10" y="18" font-family="Inter, sans-serif" font-size="8" fill="#141210">2024</text>
    <line x1="-40" y1="25" x2="40" y2="25" stroke="#8e2e2e" stroke-width=".5"/>
    <text x="0" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#8e2e2e">$40</text>
  </g>
</svg>
